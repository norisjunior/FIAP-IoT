; app36-7-DeskBuddy-Toque-ESP32 — o app36-6 com um botao touch (TTP223B, GPIO 4) e o LED RGB
; da placa (GPIO 48). Toque curto acorda; toque longo liga e desliga o modo mudo. O LED mostra
; o estado: amarelo esperando a wake word, verde acordado, vermelho mudo.
;
; Do app36-4 vem a wake word, com os ajustes "AJUSTE"; do app36-6, os olhos, marcados "OLHOS".
; O que este app acrescenta esta' marcado "TOQUE" e "LED" (ver README.md). Nenhuma biblioteca
; nova: o LED usa o neopixelWrite() do proprio core.
;
; A plataforma 6.12.0 traz o Arduino core 2.0.17, cuja API de I2S e' a LEGADA
; (driver/i2s.h) — a mesma que o exemplo do Edge Impulse usa.

[env:esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPLACA_S3
    ; OLHOS: configuracao da TFT_eSPI para a tela GC9A01 (no lugar do User_Setup.h da biblioteca)
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_SCLK=9
    -DTFT_MOSI=10
    -DTFT_DC=11
    -DTFT_CS=12
    -DTFT_RST=13
    -DTFT_MISO=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    ; OLHOS: no S3 com o core 2.0.x, a porta SPI padrao da TFT_eSPI trava no tft.init()
    -DUSE_HSPI_PORT=1
    ; OLHOS: a tela nao tem touch; sem isto a TFT_eSPI avisa a cada compilacao
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
