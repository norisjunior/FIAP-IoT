; PlatformIO Project Configuration File
;
; EdgeAI no ESP32-C3 Super Mini Plus (com motor de vibracao) - a Random Forest roda
; dentro do ESP32. Sem rede: nao ha PubSubClient nem ArduinoJson. So o driver do sensor.
;
; A placa nao tem chip USB-serial: a USB vai direto no ESP32-C3.
; ARDUINO_USB_CDC_ON_BOOT=1 faz o Serial sair por essa USB.

[env:esp32c3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-c3-devkitm-1
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
