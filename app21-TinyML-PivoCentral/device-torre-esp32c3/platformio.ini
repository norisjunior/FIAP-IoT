; PlatformIO Project Configuration File
;
; A torre do pivo no ESP32-C3 Super Mini Plus (com motor de vibracao) - a rede
; neural (TFLite) decide na placa, publica a janela e manda a ordem para a bomba.
;
; A placa nao tem chip USB-serial: a USB vai direto no ESP32-C3.
; ARDUINO_USB_CDC_ON_BOOT=1 faz o Serial sair por essa USB.

[env:esp32c3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-c3-devkitm-1
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
    johnosbb/MicroTFLite @ ^1.0.4
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
