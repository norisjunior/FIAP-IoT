; app36-8-DeskBuddy-DeepSleep-ESP32 — o app36-7 com deep sleep. O toque longo apaga a tela,
; deixa o LED vermelho no minimo e poe o ESP32 para dormir: sem CPU e sem clock no microfone,
; ninguem escuta. Um toque acorda.
;
; Do app36-4 vem a wake word ("AJUSTE"); do app36-6, os olhos ("OLHOS"); do app36-7, o toque
; e o LED ("TOQUE", "LED"). O que este app acrescenta esta' marcado "SONO" (ver README.md).
;
; A plataforma 6.12.0 traz o Arduino core 2.0.17, cuja API de I2S e' a LEGADA
; (driver/i2s.h) — a mesma que o exemplo do Edge Impulse usa.

[env:esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPLACA_S3
    ; OLHOS: configuracao da TFT_eSPI para a tela GC9A01 (no lugar do User_Setup.h da biblioteca)
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_SCLK=9
    -DTFT_MOSI=10
    -DTFT_DC=11
    -DTFT_CS=12
    -DTFT_RST=13
    -DTFT_MISO=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    ; OLHOS: no S3 com o core 2.0.x, a porta SPI padrao da TFT_eSPI trava no tft.init()
    -DUSE_HSPI_PORT=1
    ; OLHOS: a tela nao tem touch; sem isto a TFT_eSPI avisa a cada compilacao
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
