; PlatformIO Project Configuration File
;
; app25-Inferencia-AI-API_Sinais-MultiClass_IMU - o ESP32 publica a janela de
; features e recebe de volta a classe prevista pela nuvem (4 estados do motor).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
