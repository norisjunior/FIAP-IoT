; PlatformIO Project Configuration File
;
; app-2-mic-PALMA — janela de 32 ms, RMS e limiar: o LED acende na palma.
; Etapa 2 da trilha de audio: transformar o sinal em UM numero e decidir com ele.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).
;
; API de I2S LEGADA (driver/i2s.h) — Arduino core 2.0.17.

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
