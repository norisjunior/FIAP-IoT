; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; O pioarduino se identifica como "espressif32" com numeracao 5x.x.x, que e'
; SEMPRE maior que a do platform oficial (6.12.0). Se ele for instalado na pasta
; padrao (~/.platformio/platforms), qualquer projeto com `platform = espressif32`
; sem versao passa a compilar com pioarduino silenciosamente -- porque, sem pin,
; o PlatformIO escolhe a MAIOR versao instalada.
; Mantendo o pioarduino numa pasta separada, ele fica visivel so para este
; projeto e o padrao da maquina continua sendo platformio/espressif32 6.12.0.
platforms_dir = ${platformio.core_dir}/platforms-pioarduino

[env:esp32]
; O ESP32-C6 (RISC-V, Wi-Fi 6 + BLE 5) so e' suportado pelo core Arduino-ESP32
; 3.x (ESP-IDF 5.x). O platform oficial platformio/espressif32 6.12.0 entrega o
; core 2.0.17, que nao conhece o C6 -- por isso, AQUI, o fork da comunidade
; pioarduino e' obrigatorio (ver [platformio] acima: ele fica numa pasta
; separada para nao virar o padrao da maquina).
; Versao FIXADA em 53.03.13 (Arduino 3.0.7 / ESP-IDF 5.3), a mesma usada pelos
; app17-6/7: releases mais novos montam um penv proprio via `uv` e podem falhar
; ("Failed to install Python dependencies into penv").
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = post:scripts/merge_firmware.py

;upload_port = COM6

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit SSD1306 @ ^2.5.15
