<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sub=(p,a,b)=>clamp((p-a)/(b-a));
const COL=k=>`var(--${k})`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=v=>v.toFixed(2).replace('.',',');
// Onda de áudio desenhada como barras verticais; env(x) dá a amplitude de 0 a 1
function wavePath(x0,x1,ym,h,env,t,n){
  let d='';const st=(x1-x0)/(n-1);
  for(let k=0;k<n;k++){
    const x=x0+k*st,f=k/(n-1);
    const j=.35+.65*Math.abs(Math.sin(k*1.93+t*.011)*Math.cos(k*.61-t*.007));
    const a=Math.max(.6,h*clamp(env(f))*j);
    d+=`M${x.toFixed(1)} ${(ym-a).toFixed(1)}V${(ym+a).toFixed(1)}`;
  }
  return d;
}
function setPill(id,txt,cls){const g=$(id);g.querySelector('text').textContent=txt;g.classList.toggle('ok',cls==='ok');g.classList.toggle('busy',cls==='busy');}

function Diagram(cfg){
  const {steps,segs,render,msg,label}=cfg;
  segs.forEach(g=>{g.L=Math.hypot(g.b[0]-g.a[0],g.b[1]-g.a[1]);});
  const lits=segs.map(g=>{
    el('line',{x1:g.a[0],y1:g.a[1],x2:g.b[0],y2:g.b[1],class:'base'},$('baseLines'));
    const l=el('line',{x1:g.a[0],y1:g.a[1],x2:g.b[0],y2:g.b[1],class:'lit'},$('litLines'));
    l.style.strokeDasharray=g.L;l.style.strokeDashoffset=g.L;return l;
  });
  let T=0;steps.forEach(s=>{s.s=T;T+=s.d;s.moves=s.moves||[];});
  const END=T,REST=2600;
  const first=segs.map(()=>null);
  steps.forEach((s,i)=>s.moves.forEach(m=>{
    m.route=m.route||[m.seg];m.c=m.c||s.c;m.n=m.n||1;m.a=m.a??0;m.b=m.b??1;
    m.lens=m.route.map(k=>segs[k].L);m.tot=m.lens.reduce((a,b)=>a+b,0);
    let acc=0;m.route.forEach((k,j)=>{const c0=acc/m.tot,c1=(acc+m.lens[j])/m.tot;acc+=m.lens[j];if(!first[k])first[k]={i,m,c0,c1};});
  }));
  function routePt(m,f){
    let d=f*m.tot;
    for(let j=0;j<m.route.length;j++){
      const g=segs[m.route[j]],L=m.lens[j];
      if(d<=L||j===m.route.length-1){const u=clamp(d/L);const A=m.rev?g.b:g.a,B=m.rev?g.a:g.b;return[A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u];}
      d-=L;
    }
  }
  const pool=[];
  for(let k=0;k<14;k++){const g=el('g',{},$('pkts'));const r=el('rect',{},g);const t=el('text',{class:'pk','text-anchor':'middle',y:5},g);g.style.visibility='hidden';pool.push({g,r,t,lab:null});}
  function showPkt(k,x,y,lab,c){
    const P=pool[k];
    if(P.lab!==lab){P.lab=lab;P.t.textContent=lab;
      if(lab){const w=lab.length*8.5+24;P.r.setAttribute('x',-w/2);P.r.setAttribute('width',w);P.r.setAttribute('y',-16);P.r.setAttribute('height',32);P.r.setAttribute('rx',16);}
      else{P.r.setAttribute('x',-8);P.r.setAttribute('width',16);P.r.setAttribute('y',-8);P.r.setAttribute('height',16);P.r.setAttribute('rx',8);}}
    P.r.style.fill=c;P.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);P.g.style.visibility='visible';
  }
  const bars=[],N=steps.length,BW=30,GAP=6,bx=1560-(N*BW+(N-1)*GAP);
  for(let k=0;k<N;k++)bars.push(el('rect',{x:bx+k*(BW+GAP),y:74,width:BW,height:8,rx:4},$('stepBar')));
  const nodes=[...document.querySelectorAll('.node')];
  let reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  const S={t:0,speed:1,playing:!reduce,cap:-1};
  function where(){
    const t=S.t;if(t>=END)return[N-1,1];
    let i=0;while(i<N-1&&t>=steps[i].s+steps[i].d)i++;
    return[i,clamp((t-steps[i].s)/steps[i].d)];
  }
  function caption(i){
    const s=steps[i],m=msg(i);
    $('capNum').textContent=i+1;$('capNum').style.background=COL(s.c);
    $('capTitle').textContent=s.t;$('capDesc').textContent=s.x;
    let h=`<div class="msg-kind">${esc(m.kind)}</div>`;
    m.rows.forEach(r=>{h+=`<div class="row" style="--kc:${COL(r.c||s.c)}"><span class="k">${esc(r.k)}</span><span class="v">${esc(r.v)}</span>${r.n?`<span class="note">${esc(r.n)}</span>`:''}</div>`;});
    $('msg').innerHTML=`<div class="msg-in">${h}</div>`;
    $('stepTxt').textContent=label(i);
    bars.forEach((r,k)=>{r.style.fill=k<i?'var(--muted)':k===i?COL(s.c):'var(--line)';r.style.opacity=k<i?'.45':'1';});
  }
  function draw(now){
    const[i,p]=where(),s=steps[i];
    nodes.forEach(n=>{const on=(s.on||[]).includes(n.id);n.classList.toggle('on',on);if(on)n.style.setProperty('--c',COL(s.c));});
    segs.forEach((g,k)=>{const F=first[k];let f=0;
      if(F){if(i>F.i)f=1;else if(i===F.i)f=sub(sub(p,F.m.a,F.m.b),F.c0,F.c1);}
      lits[k].style.stroke=F?COL(F.m.c):'none';
      lits[k].style.strokeDashoffset=((F&&F.m.rev)?-1:1)*g.L*(1-f);});
    let used=0;
    s.moves.forEach(m=>{
      if(p<m.a||p>m.b||S.t>=END)return;const q=sub(p,m.a,m.b);
      for(let k=0;k<m.n;k++){
        let f;
        if(m.n===1)f=ease(q);
        else{const w=m.w||.3,s0=k*(1-w)/(m.n-1);f=sub(q,s0,s0+w);if(f<=0||f>=1)continue;}
        const[x,y]=routePt(m,f);if(used<pool.length)showPkt(used++,x,y,m.label||'',COL(m.c));
      }
    });
    for(let k=used;k<pool.length;k++)pool[k].g.style.visibility='hidden';
    render(i,p,now);
    if(i!==S.cap){S.cap=i;caption(i);}
  }
  function goStep(i){S.t=steps[clamp(i,0,N-1)].s+1;}
  function next(){const[i]=where();if(i<N-1&&S.t<END)goStep(i+1);else S.t=0;}
  function prev(){const[i,p]=where();if(S.t>=END||p*steps[i].d>900)goStep(i);else goStep(i-1);}
  const bPlay=$('bPlay');
  function setPlay(v){S.playing=v;bPlay.textContent=v?'Pausar':'Reproduzir';bPlay.setAttribute('aria-pressed',String(!v));}
  bPlay.addEventListener('click',()=>setPlay(!S.playing));
  $('bNext').addEventListener('click',next);
  $('bPrev').addEventListener('click',prev);
  $('bReset').addEventListener('click',()=>{S.t=0;});
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{S.speed=+b.dataset.s;document.querySelectorAll('.seg button').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));}));
  const stage=$('stage'),bFull=$('bFull');
  bFull.addEventListener('click',()=>{try{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}else if(stage.requestFullscreen){stage.requestFullscreen().catch(()=>{});}}catch(e){}});
  document.addEventListener('fullscreenchange',()=>{bFull.textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';});
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement)){e.preventDefault();setPlay(!S.playing);}
    else if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });
  setPlay(S.playing);
  let last=performance.now();
  function frame(now){const dt=Math.min(100,now-last);last=now;if(S.playing){S.t+=dt*S.speed;if(S.t>=END+REST)S.t=0;}draw(now);requestAnimationFrame(frame);}
  draw(last);requestAnimationFrame(frame);
}

const CL=['wake','unk','noise'],CN=['WakeWord','desconhecido','ruido'];
const ENV=[
  f=>.06+.95*Math.exp(-Math.pow((f-.36)/.07,2))+.85*Math.exp(-Math.pow((f-.58)/.1,2)),
  f=>.12+.75*Math.pow(Math.abs(Math.sin(f*11.5+.6)),1.4)*(f>.08&&f<.92?1:.15),

];

// QR code ilustrativo
const qr=[];
(()=>{const g=$('qr'),c=80/11,x0=80,y0=290,F=[[0,0],[0,8],[8,0]];
  const inF=(r,k)=>F.some(([fr,fk])=>r>=fr&&r<fr+3&&k>=fk&&k<fk+3);
  F.forEach(([r,k])=>{qr.push(el('rect',{x:x0+k*c+1,y:y0+r*c+1,width:3*c-2,height:3*c-2,rx:2,style:'fill:none;stroke:var(--ink);stroke-width:2.2'},g));
    qr.push(el('rect',{x:x0+(k+1)*c,y:y0+(r+1)*c,width:c-.6,height:c-.6,rx:1,style:'fill:var(--ink)'},g));});
  for(let r=0;r<11;r++)for(let k=0;k<11;k++){
    if(inF(r,k)||(r*7+k*13+r*k*3)%5>1)continue;
    qr.push(el('rect',{x:x0+k*c,y:y0+r*c,width:c-.6,height:c-.6,rx:1,style:'fill:var(--ink)'},g));
  }})();

CN.forEach((n,k)=>{const y=310+k*42,g=$('rows');

  cbar.push(el('rect',{x:722,y:y-10,width:0,height:8,rx:4,style:`fill:var(--${CL[k]})`},g));

// MFCC: 27 colunas × 13 linhas
const heatCols=[];
(()=>{const g=$('heat'),C=27,R=13,w=10,h=6;
  for(let c=0;c<C;c++){const col=el('g',{opacity:0},g);heatCols.push(col);
    for(let r=0;r<R;r++){
      const e=clamp(ENV[0](.04+c/C*.72)*.75);
      const v=clamp(e*(.35+.65*Math.abs(Math.sin(r*1.1+c*.37)))*(1-r/18)+.06*Math.abs(Math.sin(c*r+1)));
      el('rect',{x:920+c*w,y:392+r*h,width:w-.8,height:h-.8,style:`fill:color-mix(in srgb,var(--proc) ${Math.round(v*100)}%,var(--surface))`},col);
    }}})();

// Rede neural
const neurons=[],edges=[];
(()=>{const g=$('net'),L=[[960,5],[1055,4],[1150,3]],ys=n=>Array.from({length:n},(_,k)=>546+(k-(n-1)/2)*16);
  const eg=el('g',{},g);
  for(let a=0;a<2;a++)ys(L[a][1]).forEach(y1=>ys(L[a+1][1]).forEach(y2=>edges.push(el('line',{x1:L[a][0],y1,x2:L[a+1][0],y2,style:'stroke:var(--line);stroke-width:1.4'},eg))));
  L.forEach(([x,n],a)=>ys(n).forEach((y,k)=>neurons.push({c:el('circle',{cx:x,cy:y,r:6.5,style:'fill:var(--surface);stroke:var(--muted);stroke-width:1.5'},g),out:a===2?k:-1})));
})();

// Saída
const OUT=[.94,.04,.02],obar=[],oval=[];
CN.forEach((n,k)=>{const y=626+k*19,g=$('outs');
  const t=el('text',{x:920,y,class:'ms',style:`fill:var(--${CL[k]})`},g);t.textContent=n;
  el('rect',{x:1040,y:y-9,width:100,height:8,rx:4,class:'bar-bg'},g);
  obar.push(el('rect',{x:1040,y:y-9,width:0,height:8,rx:4,style:`fill:var(--${CL[k]})`},g));
  const v=el('text',{x:1190,y,class:'ms','text-anchor':'end',style:'fill:var(--ink)'},g);v.textContent='–';oval.push(v);
});

// Amostras de teste
const TD=[0,1,2,0,2,1,0,1,0,2,1,0,2,0,1,2,0,1,2,1,0],tdots=[];
TD.forEach((c,k)=>{const r=Math.floor(k/7),q=k%7;tdots.push(el('circle',{cx:1322+q*31,cy:308+r*34,r:10,style:'fill:none;stroke:var(--line);stroke-width:1.5'},$('dots')));});

$('wave2').setAttribute('d',wavePath(920,1190,325,22,ENV[0],0,64));

const steps=[
{c:'acq',d:3000,on:['n0'],t:'Conectar o celular',x:'No Edge Impulse: Devices → Connect a new device → Use your mobile phone. O QR code transforma o celular num coletor.'},
{c:'wake',d:5200,on:['n1','nr','n2'],t:'Gravar a wake word',x:'Label WakeWord: pelo menos 40 gravações de 2 s dizendo “Ei Fioti”, variando distância, ritmo e entonação.',
 moves:[{route:[0,1,2],n:5,w:.26,label:'2 s',a:.04,b:.96}]},
{c:'unk',d:4600,on:['n1','nr','n2'],t:'Gravar o que não é a wake word',x:'Label desconhecido: outras palavras, inclusive parecidas, para o modelo aprender quando não disparar.',
 moves:[{route:[0,1,2],n:5,w:.26,label:'2 s',a:.04,b:.96}]},
{c:'noise',d:4200,on:['n1','nr','n2'],t:'Gravar o ruído',x:'Label ruido: o som do ambiente sem ninguém falando, gravado em lugares diferentes.',
 moves:[{route:[0,1,2],n:5,w:.26,label:'2 s',a:.04,b:.96}]},
{c:'acq',d:2800,on:['n2'],t:'Dataset pronto',x:'Cada gravação subiu pela internet e caiu no Data acquisition, já com o rótulo da sua classe.'},
{c:'proc',d:3000,on:['n2','n3'],t:'Separar treino e teste',x:'Perform train/test split: cerca de 80% para treinar e 20% guardados para provar o modelo no final.',
 moves:[{seg:3,label:'dataset',a:0,b:.35}]},
{c:'proc',d:4200,on:['n4'],t:'Janela de 1,5 s',x:'O impulse olha 1,5 s por vez. A janela desliza sobre cada gravação de 2 s e gera vários exemplos de treino.',
 moves:[{seg:4,label:'treino',a:0,b:.25}]},
{c:'proc',d:3600,on:['n4'],t:'MFCC: o som vira uma imagem',x:'O bloco MFCC transforma as 24 000 amostras da janela em 975 números que descrevem o timbre ao longo do tempo.'},
{c:'proc',d:4000,on:['n4'],t:'A rede neural aprende',x:'A cada ciclo de treino, a rede compara o que previu com o rótulo certo e ajusta os pesos para errar menos.'},
{c:'proc',d:3000,on:['n4'],t:'Três probabilidades',x:'Para cada janela, a rede devolve uma probabilidade por classe. As três somam 1.'},
{c:'ship',d:3600,on:['n5'],t:'Model testing',x:'O modelo classifica as amostras de teste, que nunca viu no treino. É a prova de que ele generaliza.',
 moves:[{seg:5,label:'modelo',a:0,b:.25}]},
{c:'ship',d:4200,on:['n6'],t:'Deployment: Docker container',x:'O impulse inteiro, MFCC e rede neural, vira uma imagem Docker que roda em qualquer computador com a sua chave de API.',
 moves:[{seg:6,label:'deploy',a:0,b:.4}]}
];
const segs=[
{a:[320,550],b:[435,550]},{a:[435,550],b:[435,323]},{a:[435,323],b:[550,323]},
{a:[710,440],b:[710,470]},{a:[870,570],b:[900,570]},{a:[1210,313],b:[1290,313]},{a:[1415,440],b:[1415,470]}
];
function msg(i){switch(i){
case 0:return{kind:'Edge Impulse · Devices',rows:[{k:'Caminho',v:'Devices → Connect a new device → Use your mobile phone'},{k:'QR code',v:'abre o coletor no navegador do celular',n:'o celular passa a aparecer como device do projeto, pronto para gravar'}]};
case 1:return{kind:'Data acquisition · aba do celular',rows:[{k:'Label',v:'WakeWord'},{k:'Sample length',v:'2000 ms · 16 kHz = 32 000 amostras',c:'acq'},{k:'Variação',v:'perto e longe, rápido e devagar, com ruído de fundo, outras vozes',c:'muted',n:'fale “Ei Fioti” no meio dos 2 s, não no comecinho'}]};
case 2:return{kind:'Data acquisition · aba do celular',rows:[{k:'Label',v:'desconhecido'},{k:'Exemplos',v:'fiot, fiap, ei, oi, sensor, projeto, contar de 1 a 20',c:'muted',n:'é esta classe que ensina o modelo a NÃO disparar com palavras parecidas'}]};
case 3:return{kind:'Data acquisition · aba do celular',rows:[{k:'Label',v:'ruido'},{k:'Exemplos',v:'sala vazia, ar-condicionado, passos, cadeira, digitação',c:'muted',n:'grave em mais de um ambiente, senão o modelo decora um lugar só'}]};
case 4:return{kind:'Dataset no Edge Impulse',rows:[{k:'WakeWord',v:'40+ amostras de 2 s',c:'wake'},{k:'desconhecido',v:'40+ amostras de 2 s',c:'unk'},{k:'ruido',v:'40+ amostras de 2 s',c:'noise'}]};
case 5:return{kind:'Data acquisition · menu ⋮',rows:[{k:'Ação',v:'Perform train/test split'},{k:'Treino',v:'≈ 80% das amostras',c:'proc'},{k:'Teste',v:'≈ 20%, separado para o Model testing',c:'ship'}]};
case 6:return{kind:'Impulse design · Time series data',rows:[{k:'Window size',v:'1500 ms'},{k:'Frequência',v:'16 000 Hz → 1,5 × 16 000 = 24 000 amostras por janela'},{k:'Por quê',v:'“Ei Fioti” inteiro cabe em 1,5 s',c:'muted',n:'a mesma janela de 1,5 s vai ser usada pelo servidor.py na hora de ouvir'}]};
case 7:return{kind:'Impulse design · Processing block',rows:[{k:'Bloco',v:'MFCC (Audio)'},{k:'Entrada',v:'24 000 amostras int16'},{k:'Saída',v:'975 features = 13 coeficientes × 75 quadros',n:'é o “desenho” do som que a rede enxerga, como uma imagem'}]};
case 8:return{kind:'Impulse design · Learning block',rows:[{k:'Bloco',v:'Classification (rede neural)'},{k:'Entrada',v:'975 features do MFCC'},{k:'Treino',v:'ciclos de treino ajustando os pesos sobre os 80% de treino'}]};
case 9:return{kind:'Saída da rede para uma janela com “Ei Fioti” (exemplo)',rows:[{k:'WakeWord',v:'0,94',c:'wake'},{k:'desconhecido',v:'0,04',c:'unk'},{k:'ruido',v:'0,02',c:'noise',n:'as três somam 1: são probabilidades'}]};
case 10:return{kind:'Model testing',rows:[{k:'Ação',v:'Classify all'},{k:'Dados',v:'os ≈ 20% do teste, nunca usados no treino'},{k:'Resultado',v:'acurácia e matriz de confusão por classe',n:'se o teste for bem pior que o treino, faltou variedade nas gravações'}]};
default:return{kind:'Deployment → Docker container',rows:[{k:'Comando',v:'docker run --rm -it -p 1337:1337 public.ecr.aws/g7a8t7v6/inference-container:v1.95.15 --api-key ei_•••• --run-http-server 1337'},{k:'O que faz',v:'baixa o seu impulse com a chave e abre uma API HTTP na porta 1337',c:'muted',n:'a chave é sua: não publique'}]};
}}
const blkT=['tA','tB','tC','tD'].map($);
function render(i,p,now){
  // QR
  qr.forEach((r,k)=>r.style.opacity=i>0||k/qr.length<p*1.6?1:.12);
  // Contadores
  const rec=i>=1&&i<=3?i-1:-1;
  for(let k=0;k<3;k++){
    const f=i>k+1?1:i===k+1?sub(p,.04,.96):0;
    cbar[k].setAttribute('width',(84*f).toFixed(1));
    cnt[k].textContent=f>=1?'40+':String(Math.round(f*40));
    rowHl[k].classList.toggle('on',rec===k||i===4);
  }
  // Gravação
  if(rec>=0){
    $('lblTxt').textContent='Label: '+CN[rec];$('lblTxt').style.fill=COL(CL[rec]);
    $('wave1').style.stroke=COL(CL[rec]);
    $('wave1').setAttribute('d',wavePath(80,300,590,24,ENV[rec],now,44));
    $('recBar').style.fill=COL(CL[rec]);$('recBar').setAttribute('width',(224*((sub(p,.04,.96)*5)%1)).toFixed(1));
  }else{
    $('lblTxt').textContent=i===0?'Label: —':'coleta concluída';$('lblTxt').style.fill='';
    $('wave1').style.stroke='var(--line)';$('wave1').setAttribute('d',wavePath(80,300,590,24,()=>0,0,44));
    $('recBar').setAttribute('width',0);
  }
  // Split
  const fs=i>5?1:i===5?ease(sub(p,.35,.85)):0;
  $('trainR').style.fill=fs>0?'var(--proc)':'var(--line)';
  $('testR').style.fill=fs>0?'var(--ship)':'var(--line)';
  $('testR').setAttribute('x',(794+10*fs).toFixed(1));$('testR').setAttribute('width',(56-10*fs).toFixed(1));
  $('splitLbl').setAttribute('opacity',fs.toFixed(2));
  // Impulse
  const blk=i>=6&&i<=9?i-6:-1;
  blkT.forEach((t,k)=>{t.style.fill=k===blk?'var(--proc)':'';t.style.fontWeight=k===blk?'500':'';});
  const sl=i===6?.5-.5*Math.cos(sub(p,.25,1)*Math.PI*4):0;
  $('win').setAttribute('x',(920+68*sl).toFixed(1));$('win').style.opacity=i>=6?1:.25;
  $('wave2').style.opacity=i>=6?1:.35;
  const rev=i>7?27:i===7?Math.floor(sub(p,.05,.85)*27):0;
  heatCols.forEach((c,k)=>c.setAttribute('opacity',k<rev?1:0));
  const tr=i===8,done=i>8;
  edges.forEach((e,k)=>{const a=tr?(Math.sin(now*.007+k*1.7)>.2?1:.25):done?.45:1;e.style.stroke=tr||done?'var(--proc)':'var(--line)';e.style.opacity=a;});
  neurons.forEach((n,k)=>{const on=tr||done;n.c.style.fill=on?(n.out>=0?COL(CL[n.out]):'var(--proc)'):'var(--surface)';n.c.style.stroke=on?'transparent':'var(--muted)';n.c.style.opacity=tr&&n.out<0?(.55+.45*Math.abs(Math.sin(now*.005+k))):1;});
  $('netTxt').textContent=tr?'ajustando os pesos':done?'treinada':'';
  const fo=i>9?1:i===9?ease(sub(p,.1,.75)):0;
  OUT.forEach((v,k)=>{obar[k].setAttribute('width',(100*v*fo).toFixed(1));oval[k].textContent=fo>0?fmt(v*fo):'–';});
  // Teste
  const nt=i>10?TD.length:i===10?Math.floor(sub(p,.3,.95)*TD.length):0;
  tdots.forEach((d,k)=>{d.style.fill=k<nt?COL(CL[TD[k]]):'none';d.style.stroke=k<nt?'transparent':'var(--line)';});
  // Docker
  const fd=i===11?sub(p,.4,.9):0;
  $('dkBar').setAttribute('width',(210*fd).toFixed(1));$('dk').setAttribute('opacity',i===11?.4+.6*fd:.4);
}
Diagram({steps,segs,render,msg,label:i=>`Etapa ${i+1} de ${steps.length}`});
})();
