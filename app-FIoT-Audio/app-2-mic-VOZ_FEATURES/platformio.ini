; PlatformIO Project Configuration File
;
; app-2-mic-VOZ_FEATURES — 4 features por janela de 256 ms, no Teleplot.
; Etapa 2 da trilha de audio: media, desvio, pico a pico e ZCR.
;
; Restricao didatica: NADA de FFT/MFCC aqui. O ponto e o aluno bater no teto
; da estatistica de janela e concluir que a wake word nao cabe nela.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).
;
; API de I2S LEGADA (driver/i2s.h) — Arduino core 2.0.17.

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 921600
