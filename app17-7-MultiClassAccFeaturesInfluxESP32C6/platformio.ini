; PlatformIO Project Configuration File
;
; app17-7-MultiClassAccFeaturesInflux — features de aceleracao por janela
; (2 s @ 500 Hz), 5 classes ciclicas, publicadas via MQTT (JSON).
;
; ALVO: ESP32-C6 (ESP32-C6-DevKitC-1), nos mesmos pinos do app17-6.

[env:esp32-c6-devkitc-1]
; O ESP32-C6 (núcleo RISC-V, Wi-Fi 6 + BLE 5) só é suportado pelo core
; Arduino-ESP32 3.x (ESP-IDF 5.x). O platform oficial `platformio/espressif32`
; ainda entrega o core 2.x, que não conhece o C6 — por isso usamos o fork
; da comunidade `pioarduino`.
;
; Versão FIXADA em 53.03.13 (Arduino 3.0.7 / ESP-IDF 5.3) de propósito: os
; releases mais novos montam um ambiente Python próprio via `uv` que pode
; falhar ("Failed to install Python dependencies into penv"). Para atualizar
; no futuro, troque a tag na URL.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

; A porta "UART" da DevKitC-1 (ponte USB-serial) já funciona com Serial padrão.
; Se for gravar/monitorar pela porta "USB" nativa do C6, descomente:
; build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
