[wokwi]
version = 1
elf = ".pio/build/esp32/firmware.elf"
firmware = ".pio/build/esp32/firmware.bin"

# Expoe a Serial simulada via servidor RFC2217 (TCP) para programas externos.
# Assim o coletor_raw.py consegue ler o stream do Wokwi com:
#   serial.serial_for_url("rfc2217://localhost:4000", baudrate=115200)
# Obs.: mantenha a aba do simulador VISIVEL no VS Code, senao a simulacao pausa.
rfc2217ServerPort = 4000
