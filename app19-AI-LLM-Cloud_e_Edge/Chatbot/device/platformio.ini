; PlatformIO Project Configuration File
;
; Chatbot - o ESP32 publica a janela de features e recebe de volta a
; classe prevista pela nuvem. O que muda neste app esta no fluxo do n8n.

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
