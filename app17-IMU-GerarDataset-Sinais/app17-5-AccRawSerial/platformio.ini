; PlatformIO Project Configuration File
;
; app17-5-AccRawSerial — coleta RAW via Serial (material de referencia).
; Sem MQTT/WiFi/JSON: o firmware so imprime ax,ay,az na Serial.
; Por isso a UNICA dependencia e a do sensor (FastIMU).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0

; Monitor serial: 115200, sem reiniciar a placa ao abrir.
; Placas com CH9102/CH340: com RTS/DTR ligados o ESP32 fica preso em reset.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
