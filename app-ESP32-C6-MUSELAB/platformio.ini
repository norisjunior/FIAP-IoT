; ESP32-C6 Muse Lab (nanoESP32-C6)
;
; A placa tem duas USB-C. Use a marcada CH343: ela grava e mostra o Serial
; sem flag nenhuma (o CH343 e' um chip USB-serial ligado no TX/RX do C6).

[platformio]
; O ESP32-C6 so' roda com o core Arduino 3.x, que o espressif32 6.12.0 nao tem.
; Por isso este projeto usa o pioarduino, numa pasta separada para ele nao
; virar o padrao da maquina (mesmo esquema do app09 C6 e dos app17-6/7).
platforms_dir = ${platformio.core_dir}/platforms-pioarduino

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
monitor_speed = 115200

; Para usar a outra USB-C (marcada ESP32C6, USB nativa do chip), descomente:
; build_flags =
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=1
