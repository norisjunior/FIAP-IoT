; PlatformIO Project Configuration File
;
; app17-11-MotorMultiClasse — 5 classes do motor (Forma 1, hardware fisico).
; O firmware funciona so pela Serial, sem WiFi/broker (Fase 1). Com WiFi e o
; broker da IoT-platform disponiveis, tambem publica por MQTT (Fase 2) --
; sem precisar recompilar: a conexao e tentada e, se falhar, o firmware
; segue normalmente so pela Serial.

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
