; PlatformIO Project Configuration File
;
; app-1-mic-RAW — le o INMP441 por I2S e mostra a forma de onda no Teleplot.
; Etapa 1 da trilha de audio: ver o sinal antes de resumi-lo.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).
;
; A plataforma 6.12.0 traz o Arduino core 2.0.17, cuja API de I2S e a LEGADA
; (driver/i2s.h). Nao troque por ESP_I2S.h: e do core 3.x e nao compila aqui.

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
