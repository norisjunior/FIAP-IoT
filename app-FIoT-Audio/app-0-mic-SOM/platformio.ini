; PlatformIO Project Configuration File
;
; app-0-mic-SOM — o microfone produz numeros.
; Etapa 0 da trilha de audio: a versao mais curta possivel, usando a
; biblioteca I2S que ja vem no core do ESP32. Sem cabecalho proprio.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
