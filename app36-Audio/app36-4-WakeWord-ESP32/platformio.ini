; app36-4-WakeWord-ESP32 — reconhece a wake word "Ei Fioti" no ESP32-S3 Super Mini + INMP441.
; O codigo e' o exemplo esp32_microphone_continuous da biblioteca do Edge Impulse,
; com os ajustes marcados "AJUSTE" (ver README.md).
;
; A plataforma 6.12.0 traz o Arduino core 2.0.17, cuja API de I2S e' a LEGADA
; (driver/i2s.h) — a mesma que o exemplo do Edge Impulse usa.

[env:esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPLACA_S3
