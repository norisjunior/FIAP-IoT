; PlatformIO Project Configuration File
;
; A bomba do pivo - assina as ordens da placa, da nuvem e da pessoa, e obedece
; a quem manda (a pessoa, depois a nuvem, depois a placa), cada ordem com prazo.

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1
    madhephaestus/ESP32Servo @ ^3.0.9
