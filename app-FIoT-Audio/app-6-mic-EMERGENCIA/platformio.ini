; PlatformIO Project Configuration File
;
; app-6-mic-EMERGENCIA — wake word + comando EMERGENCIA (etapa a fazer).
; Exige um projeto novo no Edge Impulse, com a classe "emergencia".
;
; A biblioteca exportada entra em lib/<Nome>_inferencing/ e NAO cabe na
; particao padrao: huge_app.csv e obrigatorio.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 921600
