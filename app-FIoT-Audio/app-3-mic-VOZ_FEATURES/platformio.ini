; PlatformIO Project Configuration File
;
; app-3-mic-VOZ_FEATURES — 6 features por janela de 250 ms (CSV + Teleplot).
; Etapa 3 da trilha de audio: mean, std, p2p, rms, max_abs e zcr.
;
; Restricao didatica: NADA de FFT/MFCC aqui. O ponto e o aluno bater no teto
; da estatistica de janela e concluir que FIOT e EMERGENCIA empatam nela.
;
; ALVO: ESP32 DevKit v1. NAO tem equivalente no Wokwi (nao existe peca INMP441).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
