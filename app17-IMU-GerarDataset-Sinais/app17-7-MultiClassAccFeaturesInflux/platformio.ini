; PlatformIO Project Configuration File
;
; app17-7-MultiClassAccFeaturesInflux — features de aceleracao por janela
; (1 s @ 100 Hz), 4 classes ciclicas, publicadas via MQTT (JSON).

[env:esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    https://github.com/LiquidCGS/FastIMU.git#1.3.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.1

; Monitor serial: 115200, sem reiniciar a placa ao abrir.
; Placas com CH9102/CH340: com RTS/DTR ligados o ESP32 fica preso em reset.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
